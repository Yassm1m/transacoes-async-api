# Ambiente local com LocalStack (DynamoDB, SQS, SNS, S3).
# Desde março/2026 a imagem do LocalStack exige LOCALSTACK_AUTH_TOKEN
# (conta gratuita em app.localstack.cloud). Coloque o token no arquivo .env.
services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:latest}
    container_name: transacoes-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=dynamodb,sqs,sns,s3
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/init/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8080"
    environment: &aws-local
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      TABLE_NAME: transacoes
      QUEUE_URL: http://localstack:4566/000000000000/transacoes-processamento
      TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:transacoes-eventos
      BUCKET_NAME: transacoes-comprovantes
      FALHA_SIMULADA_PERCENTUAL: ${FALHA_SIMULADA_PERCENTUAL:-0}

  worker:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    environment: *aws-local
    command: ["python", "scripts/worker_local.py"]
