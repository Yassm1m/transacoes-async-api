name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  qualidade:
    name: Lint e formatação (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format
        run: ruff format --check .

  testes:
    name: Testes (unitários + integração com moto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=xml --cov-report=term --junitxml=relatorio-testes.xml
      - name: Resumo de cobertura
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          taxa = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          print(f"### Cobertura de testes: {taxa:.1f}%")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            relatorio-testes.xml

  infra:
    name: Valida e empacota infraestrutura (SAM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install cfn-lint
      - name: cfn-lint
        run: cfn-lint template.yaml infra/*.yaml
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: sam build
        run: sam build

  deploy:
    name: Deploy na AWS (dev)
    needs: [qualidade, testes, infra]
    # Só roda na main e depois que você configurar a variável AWS_DEPLOY_ROLE_ARN.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # necessário para o OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: sam build
        run: sam build
      - name: sam deploy
        run: sam deploy --config-env dev --region "${{ vars.AWS_REGION || 'us-east-1' }}"
      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name transacoes-async-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: $API_URL" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/smoke_test.sh "$API_URL"
